    <script>
        var audioUnlocked = false;

        function unlockAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            try {
                var ctx = new (window.AudioContext || window.webkitAudioContext)();
                var buf = ctx.createBuffer(1, 1, 22050);
                var src = ctx.createBufferSource();
                src.buffer = buf;
                src.connect(ctx.destination);
                src.start(0);
                if (ctx.state === 'suspended') ctx.resume();
                ctx.close();
            } catch(e) {}
        }

        var appInventorSpeakCounter = 0;

        function speakViaAppInventor(text) {
            try {
                if (typeof AppInventor !== 'undefined' && typeof AppInventor.setWebViewString === 'function') {
                    appInventorSpeakCounter++;
                    AppInventor.setWebViewString('SPEAK:' + text + '|' + appInventorSpeakCounter);
                    return true;
                }
            } catch(e) {}
            return false;
        }

        function speakText(text) {
            if (!text) return;
            if (speakViaAppInventor(text)) return;
            if (typeof speechSynthesis !== 'undefined') {
                try {
                    speechSynthesis.cancel();
                    var utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'es-ES';
                    utterance.rate = 1.0;
                    speechSynthesis.speak(utterance);
                } catch(e) {}
            }
            if ('vibrate' in navigator) {
                navigator.vibrate(30);
            }
        }

        document.addEventListener('touchstart', unlockAudio, { once: true });
        document.addEventListener('click', unlockAudio, { once: true });
        document.addEventListener('pointerdown', unlockAudio, { once: true });

        const letterItems = [
            { label: 'A', category: 'A', color: '#c9e6ff', emoji: 'A' },
            { label: 'E', category: 'E', color: '#97f6be', emoji: 'E' },
            { label: 'I', category: 'I', color: '#fde274', emoji: 'I' },
            { label: 'O', category: 'O', color: '#8aceff', emoji: 'O' },
            { label: 'U', category: 'U', color: '#ffdad6', emoji: 'U' }
        ];
        const numberItems = [
            { label: '1', category: '1', color: '#c9e6ff', emoji: '1' },
            { label: '2', category: '2', color: '#97f6be', emoji: '2' },
            { label: '3', category: '3', color: '#fde274', emoji: '3' },
            { label: '4', category: '4', color: '#8aceff', emoji: '4' },
            { label: '5', category: '5', color: '#ffdad6', emoji: '5' }
        ];
        const animalItems = [
            { label: 'Perro', category: 'perro', color: '#a1887f', emoji: '🐶' },
            { label: 'Gato', category: 'gato', color: '#ce93d8', emoji: '🐱' },
            { label: 'Vaca', category: 'vaca', color: '#90caf9', emoji: '🐮' },
            { label: 'Conejo', category: 'conejo', color: '#f48fb1', emoji: '🐰' },
            { label: 'Pájaro', category: 'pajaro', color: '#80cbc4', emoji: '🐦' }
        ];

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        const cardsPerRound = 5;
        const totalRounds = 5;
        const roundTargets = ['I', '5', 'perro', '3', '4'];
        const numberWords = { '1': 'UNO', '2': 'DOS', '3': 'TRES', '4': 'CUATRO', '5': 'CINCO' };
        const roundItems = [];
        for (let r = 0; r < totalRounds; r++) {
            let source = r === 0 ? letterItems : numberItems;
            if (r === 2) source = animalItems;
            const base = source.slice();
            roundItems.push(r === 2 ? base : shuffle(base));
        }

        document.getElementById('progress-text').textContent = `0 de ${totalRounds}`;
        const progressDots = document.getElementById('progress-dots');
        progressDots.innerHTML = '';
        for (let i = 0; i < totalRounds; i++) {
            const dot = document.createElement('div');
            dot.className = 'flex-1 bg-surface-container-highest rounded-full';
            dot.dataset.idx = i;
            progressDots.appendChild(dot);
        }
        let currentRound = 0;
        let score = 0;
        let failures = 0;
        let cardStates = [];
        let activeCardIndex = -1;

        const cardsContainer = document.getElementById('cards-container');
        const progressText = document.getElementById('progress-text');
        const roundTitle = document.getElementById('round-title');
        const roundSubtitle = document.getElementById('round-subtitle');
        const btnCheck = document.getElementById('btn-check');
        const btnSkip = document.getElementById('btn-skip');
        const completeModal = document.getElementById('complete-modal');
        const resultText = document.getElementById('result-text');
        const dropCategories = document.querySelectorAll('.drop-category');

        function renderCards() {
            cardsContainer.innerHTML = '';
            const animalRound = currentRound === 2;
            cardStates = roundItems[currentRound].map((item, idx) => {
                const card = document.createElement('div');
                card.className = 'group cursor-grab active:cursor-grabbing w-full aspect-[4/5] bg-surface-container-lowest border-2 border-primary rounded-xl p-2 flex flex-col items-center justify-center card-shadow transition-all hover:scale-105 active:scale-95 tactile-button';
                card.setAttribute('draggable', animalRound ? 'false' : 'true');
                card.dataset.cardIdx = idx;
                card.innerHTML = `
                    <div class="flex-grow flex items-center justify-center w-full">
                        <span class="text-7xl font-bold leading-none tracking-wide" style="color: ${item.color}">${item.emoji}</span>
                    </div>
                    <span class="font-headline-md text-headline-md text-primary text-center leading-tight">${item.label}</span>
                `;
                cardsContainer.appendChild(card);
                if (animalRound) {
                    setupCardTap(card, idx);
                } else {
                    setupCardDrag(card, idx);
                }
                return { item: item, idx: idx, card: card, zone: null, selected: false, locked: false };
            });
        }

        function setupCardTap(card, idx) {
            card.classList.add('cursor-pointer');
            card.classList.remove('cursor-grab', 'active:cursor-grabbing');
            card.addEventListener('click', () => selectCard(idx));
            card.addEventListener('touchstart', (e) => {
                e.preventDefault();
                selectCard(idx);
            }, { passive: false });
        }

        function selectCard(idx) {
            if (cardStates[idx].locked) return;
            cardStates.forEach(s => {
                s.selected = false;
                s.card.classList.remove('scale-110', 'border-secondary', 'bg-secondary-container/30', 'ring-4', 'ring-secondary');
            });
            cardStates[idx].selected = true;
            cardStates[idx].card.classList.add('scale-110', 'border-secondary', 'bg-secondary-container/30', 'ring-4', 'ring-secondary');
        }

        function setupCardDrag(card, idx) {
            card.addEventListener('dragstart', (e) => {
                if (cardStates[idx].locked) { e.preventDefault(); return; }
                activeCardIndex = idx;
                e.dataTransfer.setData('text/plain', 'card-' + idx);
                setTimeout(() => card.classList.add('opacity-50'), 0);
                dropCategories.forEach(z => z.classList.add('drop-zone-active', 'border-primary', 'bg-primary-fixed/10'));
            });

            card.addEventListener('dragend', (e) => {
                card.classList.remove('opacity-50');
                dropCategories.forEach(z => z.classList.remove('drop-zone-active', 'border-primary', 'bg-primary-fixed/10'));
            });

            card.addEventListener('touchstart', (e) => {
                if (cardStates[idx].locked) return;
                if (touchDragActive) return;
                activeCardIndex = idx;
                touchDragActive = true;
                const touch = e.touches[0];

                dropCategories.forEach(z => z.classList.add('drop-zone-active', 'border-primary', 'bg-primary-fixed/10'));

                const rect = card.getBoundingClientRect();
                touchDragW = rect.width;
                touchDragH = rect.height;
                touchDragClone = card.cloneNode(true);
                touchDragClone.style.position = 'fixed';
                touchDragClone.style.zIndex = '9999';
                touchDragClone.style.pointerEvents = 'none';
                touchDragClone.style.width = touchDragW + 'px';
                touchDragClone.style.height = touchDragH + 'px';
                touchDragClone.style.left = (touch.clientX - touchDragW / 2) + 'px';
                touchDragClone.style.top = (touch.clientY - touchDragH / 2) + 'px';
                touchDragClone.style.opacity = '0.85';
                touchDragClone.style.transform = 'scale(1.05)';
                touchDragClone.classList.remove('cursor-grab', 'active:cursor-grabbing');
                document.body.appendChild(touchDragClone);
                card.classList.add('opacity-50');
            }, { passive: true });

            card.addEventListener('touchmove', (e) => {
                if (!touchDragActive || !touchDragClone) return;
                e.preventDefault();
                const touch = e.touches[0];
                touchDragClone.style.left = (touch.clientX - touchDragW / 2) + 'px';
                touchDragClone.style.top = (touch.clientY - touchDragH / 2) + 'px';

                dropCategories.forEach(z => {
                    z.classList.remove('scale-105', 'bg-secondary-container/30', 'border-secondary', 'bg-secondary-container/20');
                });
                const zone = getDropZoneAtPoint(touch.clientX, touch.clientY);
                if (zone && activeCardIndex >= 0 && !cardStates[activeCardIndex].locked) {
                    zone.classList.add('scale-105', 'bg-secondary-container/30');
                }
            }, { passive: false });

            card.addEventListener('touchend', (e) => {
                const touch = e.changedTouches[0];
                touchEndDrag(touch.clientX, touch.clientY);
            });

            card.addEventListener('touchcancel', () => {
                touchEndDrag(0, 0);
            });
        }

        function loadRound(index) {
            if (index >= totalRounds) {
                showComplete();
                return;
            }
            renderCards();
            resetZones();
            btnCheck.disabled = false;
            btnCheck.innerHTML = '<span class="material-symbols-outlined filled-icon">check_circle</span> Comprobar';
            btnCheck.className = 'w-full h-[64px] bg-secondary text-on-secondary rounded-xl font-headline-md text-headline-md tactile-button flex items-center justify-center gap-2 hover:bg-on-secondary-fixed-variant transition-all';
            btnCheck.dataset.advancing = 'false';
            const categoryDrop = document.getElementById('category-drop');
            if (currentRound === 2) {
                if (categoryDrop) categoryDrop.style.display = 'none';
            } else {
                if (categoryDrop) categoryDrop.style.display = '';
            }
            const target = roundTargets[currentRound];
            const isNumber = /^[0-9]$/.test(target);
            if (currentRound === 2) {
                roundTitle.textContent = 'MACHUCA AL PERRO';
                roundSubtitle.textContent = 'Machuca la carta del perro y confírmala para pasar al siguiente nivel';
            } else {
                roundTitle.textContent = isNumber ? `¿CUÁL ES EL NÚMERO ${numberWords[target]}?` : `ARRASTRA LA LETRA "${target}" ACA`;
                roundSubtitle.textContent = isNumber
                    ? `Arrastra la carta con el número ${target} hasta el cuadro "Suelta aquí"`
                    : `Arrastra la carta con la letra ${target} hasta el cuadro "Suelta aquí"`;
            }
            updateProgress(index);
        }

        function resetZones() {
            document.querySelectorAll('.drop-category').forEach(z => {
                z.classList.remove('border-secondary', 'bg-secondary-container/20', 'border-error', 'bg-error-container/20');
            });
            document.querySelectorAll('.drop-category .dropped-item').forEach(el => el.remove());
        }

        function updateProgress(index) {
            progressText.textContent = `${index} de ${totalRounds}`;
            const dots = progressDots.querySelectorAll('[data-idx]');
            dots.forEach((dot, i) => {
                if (i < index) {
                    dot.className = 'flex-1 bg-secondary rounded-full';
                } else if (i === index) {
                    dot.className = 'flex-1 bg-primary-container rounded-full relative overflow-hidden';
                } else {
                    dot.className = 'flex-1 bg-surface-container-highest rounded-full';
                }
            });
        }

        function launchConfetti() {
            const colors = ['#e74c3c', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#e67e22', '#1abc9c', '#e91e63'];
            const shapes = ['■', '●', '▲', '★', '♦'];
            for (let i = 0; i < 80; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                el.textContent = shapes[Math.floor(Math.random() * shapes.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.color = colors[Math.floor(Math.random() * colors.length)];
                el.style.fontSize = (8 + Math.random() * 16) + 'px';
                el.style.animationDuration = (2 + Math.random() * 3) + 's';
                el.style.animationDelay = (Math.random() * 2) + 's';
                el.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 5000);
            }
        }

        function showComplete() {
            completeModal.classList.remove('hidden');
            launchConfetti();
            const allCorrect = failures === 0;
            const icon = document.getElementById('modal-icon');
            const title = document.getElementById('modal-title');
            if (allCorrect) {
                icon.textContent = 'celebration';
                icon.className = 'material-symbols-outlined text-8xl text-secondary drop-shadow-lg relative z-10';
                icon.style.fontVariationSettings = "'FILL' 1";
                title.textContent = '¡Perfecto! 🎉';
                resultText.innerHTML = `
                    <span class="text-6xl font-bold text-secondary">${score}/${totalRounds}</span>
                    <span class="block text-body-md text-on-surface-variant mt-2">¡Lo lograste todo sin errores!</span>
                `;
            } else {
                icon.textContent = 'emoji_events';
                icon.className = 'material-symbols-outlined text-8xl text-tertiary drop-shadow-lg relative z-10';
                icon.style.fontVariationSettings = "'FILL' 1";
                title.textContent = '¡Felicidades! 🏆';
                resultText.innerHTML = `
                    <span class="block text-headline-md font-bold text-on-surface">✅ Lograste ${score} de ${totalRounds}</span>
                    <span class="block text-body-md text-on-surface-variant mt-1">❌ Fallaste ${failures} ${failures === 1 ? 'vez' : 'veces'}</span>
                `;
            }
        }

        function handleDrop(zone) {
            zone.classList.remove('drop-zone-active', 'border-primary', 'bg-primary-fixed/10');
            if (activeCardIndex < 0) return;
            const state = cardStates[activeCardIndex];
            if (!state || state.locked) return;

            const existing = zone.querySelector('.dropped-item');
            if (existing) {
                const prevIdx = parseInt(existing.dataset.cardIdx, 10);
                const prevState = cardStates[prevIdx];
                if (prevState) {
                    prevState.zone = null;
                    prevState.card.style.display = 'flex';
                    prevState.card.setAttribute('draggable', 'true');
                }
                existing.remove();
            }

            state.zone = zone.dataset.category;
            state.card.style.display = 'none';
            state.card.setAttribute('draggable', 'false');

            const dropContent = zone.querySelector('.drop-hint');
            if (dropContent) dropContent.style.display = 'none';

            const droppedEl = document.createElement('div');
            droppedEl.className = 'dropped-item flex flex-col items-center gap-1 p-2 animate-pop';
            droppedEl.dataset.cardIdx = state.idx;
            droppedEl.innerHTML = `
                <div class="w-14 h-14 rounded-lg bg-white/70 border-2 border-outline-variant flex items-center justify-center text-4xl font-bold drop-shadow-md">${state.item.emoji}</div>
                <span class="text-label-caps text-primary font-bold text-sm">${state.item.label}</span>
            `;
            zone.appendChild(droppedEl);

            zone.classList.add('border-secondary', 'bg-secondary-container/20');
            activeCardIndex = -1;
        }

        function getDropZoneAtPoint(x, y) {
            let found = null;
            dropCategories.forEach(zone => {
                const r = zone.getBoundingClientRect();
                if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
                    found = zone;
                }
            });
            return found;
        }

        let touchDragClone = null;
        let touchDragActive = false;
        let touchDragW = 0;
        let touchDragH = 0;

        function touchEndDrag(x, y) {
            touchDragActive = false;
            if (touchDragClone) {
                touchDragClone.remove();
                touchDragClone = null;
            }
            dropCategories.forEach(z => {
                z.classList.remove('drop-zone-active', 'border-primary', 'bg-primary-fixed/10', 'scale-105', 'bg-secondary-container/30');
            });
            if (activeCardIndex < 0) return;
            const state = cardStates[activeCardIndex];
            if (state && state.card) state.card.classList.remove('opacity-50');
            if (state && state.locked) return;
            const zone = getDropZoneAtPoint(x, y);
            if (zone) {
                handleDrop(zone);
            }
        }

        dropCategories.forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (activeCardIndex < 0) return;
                zone.classList.add('scale-105', 'bg-secondary-container/30');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('scale-105', 'bg-secondary-container/30');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('scale-105', 'bg-secondary-container/30');
                const raw = e.dataTransfer.getData('text/plain');
                if (raw && raw.indexOf('card-') === 0) {
                    activeCardIndex = parseInt(raw.replace('card-', ''), 10);
                }
                handleDrop(zone);
            });
        });

        function advanceRound() {
            currentRound++;
            loadRound(currentRound);
        }

        function resetRound() {
            renderCards();
            resetZones();
        }

        btnCheck.addEventListener('click', function() {
            const animalRound = currentRound === 2;
            const placed = animalRound
                ? cardStates.filter(s => s.selected)
                : cardStates.filter(s => s.zone !== null);
            if (placed.length === 0) {
                this.innerHTML = animalRound
                    ? '<span class="material-symbols-outlined filled-icon">info</span> ¡Machuca una carta!'
                    : '<span class="material-symbols-outlined filled-icon">info</span> ¡Arrastra la carta!';
                this.className = 'w-full h-[64px] bg-error-container text-on-error-container rounded-xl font-headline-md text-headline-md tactile-button flex items-center justify-center gap-2 transition-all';
                setTimeout(() => {
                    this.innerHTML = '<span class="material-symbols-outlined filled-icon">check_circle</span> Comprobar';
                    this.className = 'w-full h-[64px] bg-secondary text-on-secondary rounded-xl font-headline-md text-headline-md tactile-button flex items-center justify-center gap-2 hover:bg-on-secondary-fixed-variant transition-all';
                }, 1500);
                return;
            }

            if (this.dataset.advancing === 'true') {
                advanceRound();
                return;
            }

            const dropped = placed[0];
            const isCorrect = dropped.item.category === roundTargets[currentRound];

            this.disabled = true;
            if (isCorrect) {
                score++;
                cardStates.forEach(s => { s.locked = true; s.selected = false; });
                this.innerHTML = '<span class="material-symbols-outlined filled-icon">celebration</span> ¡Correcto!';
                this.className = 'w-full h-[64px] bg-on-secondary-container text-on-secondary rounded-xl font-headline-md text-headline-md tactile-button flex items-center justify-center gap-2 transition-all';
                if (navigator.vibrate) navigator.vibrate(80);
                speakText('¡Correcto!');
                launchConfetti();
                this.dataset.advancing = 'true';
                setTimeout(() => {
                    this.disabled = false;
                    this.innerHTML = '<span class="material-symbols-outlined filled-icon">arrow_forward</span> Siguiente nivel';
                    this.className = 'w-full h-[64px] bg-primary text-on-primary rounded-xl font-headline-md text-headline-md tactile-button flex items-center justify-center gap-2 hover:bg-primary-fixed-variant transition-all';
                }, 800);
            } else {
                failures++;
                if (animalRound) {
                    cardStates.forEach(s => {
                        s.selected = false;
                        s.card.classList.remove('scale-110', 'border-secondary', 'bg-secondary-container/30', 'ring-4', 'ring-secondary');
                    });
                } else {
                    resetRound();
                }
                this.innerHTML = '<span class="material-symbols-outlined filled-icon">close</span> ¡Intenta de nuevo!';
                this.className = 'w-full h-[64px] bg-error-container text-on-error-container rounded-xl font-headline-md text-headline-md tactile-button flex items-center justify-center gap-2 transition-all';
                if (navigator.vibrate) navigator.vibrate(150);
                speakText('Intenta de nuevo');
                setTimeout(() => {
                    this.disabled = false;
                    this.innerHTML = '<span class="material-symbols-outlined filled-icon">check_circle</span> Comprobar';
                    this.className = 'w-full h-[64px] bg-secondary text-on-secondary rounded-xl font-headline-md text-headline-md tactile-button flex items-center justify-center gap-2 hover:bg-on-secondary-fixed-variant transition-all';
                }, 1200);
            }
        });

        btnSkip.addEventListener('click', function() {
            if (navigator.vibrate) navigator.vibrate(30);
            advanceRound();
        });

        loadRound(0);
    </script>
</body></html>
